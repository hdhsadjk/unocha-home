<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="美廉社活動資訊與 LINE 連結">
  <title>美廉社活動資訊</title>
  <style>
    :root { --purple: #92278f; --purple-dark: #741d70; --bg: #faf7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: #292329; font-family: Arial, "Noto Sans TC", sans-serif; }
    .wrap { width: min(760px, 100% - 28px); margin: 0 auto; padding: 22px 0 36px; }
    .logo { display: block; width: min(340px, 78%); height: auto; margin: 0 auto 18px; }
    .hero { display: block; width: 100%; height: auto; border-radius: 16px; box-shadow: 0 5px 20px #3a15300f; }
    h1 { text-align: center; color: var(--purple-dark); font-size: clamp(24px, 5vw, 34px); margin: 22px 0 8px; }
    .intro { text-align: center; color: #625662; line-height: 1.75; margin: 0 auto 20px; }
    .cta { display: block; width: 100%; text-align: center; padding: 17px 18px; background: var(--purple); color: #fff; font-weight: 700; font-size: 21px; text-decoration: none; border-radius: 12px; box-shadow: 0 4px 0 var(--purple-dark); }
    .cta:hover { background: var(--purple-dark); }
    .notice { margin-top: 22px; padding: 14px 16px; background: #fff; border: 1px solid #ead9e9; border-radius: 10px; font-size: 13px; color: #655b65; line-height: 1.7; }
    footer { text-align: center; color: #887c87; font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="simplemart-logo.png" alt="美廉社品牌圖片">
    <img class="hero" src="campaign-store.png" alt="美廉社活動主視覺">
    <h1>活動資訊</h1>
    <p class="intro">點擊下方按鈕前往 LINE 連結，查看相關活動資訊與參加方式。</p>
    <a class="cta" href="https://lin.ee/pFcNKQk" target="_blank" rel="noopener noreferrer">前往官方領取抵用券</a>
